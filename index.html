<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaron's incomplete archive</title>
    <link rel="stylesheet" href="style.css" />
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="heading">
      <h2 class="heading-name">
        Aaron Bergunder <span id="headingPhrase" class="heading-phrase">.</span>
      </h2>
      <div class="heading-controls">
        <button class="zoom-btn" id="backToGridBtn" title="Back to all works" aria-label="Back to all works" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="12" y1="19" x2="12" y2="5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <polyline points="6,11 12,5 18,11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="zoom-controls" id="zoomControls" aria-label="Grid zoom">
          <button class="zoom-btn" id="zoomOutBtn" title="Zoom out" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6" />
              <line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <line x1="8" y1="11" x2="14" y2="11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
          <button class="zoom-btn" id="zoomInBtn" title="Zoom in" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6" />
              <line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <line x1="8" y1="11" x2="14" y2="11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <line x1="11" y1="8" x2="11" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <main id="app">
      <section id="gridView">
        <div class="container" id="container">
          <div class="intro">
            <h1>An incomplete archive of modern works</h1>
            <p></p>
          </div>
        </div>
        <!-- end container-->
      </section>

      <section id="detailView" hidden>
        <div id="detailContent"></div>
        <nav class="detail-nav">
          <a href="#" id="prevLink">&larr; Previous</a>
          <a href="#" id="nextLink">Next &rarr;</a>
        </nav>
      </section>
    </main>

    <script src="script.js" type="text/javascript"></script>
  </body>
</html>
