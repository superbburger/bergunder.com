<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaron's incomplete archive</title>
    <link rel="stylesheet" href="style.css" />
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div class="heading">
      <div><h2>Aaron Bergunder</h2></div>
      <div class="zoom-controls" id="zoomControls" aria-label="Grid zoom">
        <button class="zoom-btn" data-cols="1" title="1 wide">1</button>
        <button class="zoom-btn" data-cols="2" title="2 wide">2</button>
        <button class="zoom-btn" data-cols="3" title="3 wide">3</button>
        <button class="zoom-btn" data-cols="4" title="4 wide">4</button>
      </div>
      <div><span id="headingPhrase">.</span></div>
    </div>

    <main id="app">
      <section id="gridView">
        <div class="container" id="container">
          <div class="intro">
            <h1>An incomplete archive of modern works</h1>
            <p></p>
          </div>
        </div>
        <!-- end container-->
      </section>

      <section id="detailView" hidden>
        <a href="#" class="btn back-link" id="backLink">&larr; All works</a>
        <div id="detailContent"></div>
        <nav class="detail-nav">
          <a href="#" id="prevLink">&larr; Previous</a>
          <a href="#" id="nextLink">Next &rarr;</a>
        </nav>
      </section>
    </main>

    <script src="script.js" type="text/javascript"></script>
  </body>
</html>
